{% extends "base.html" %}

{% block title %}Home | Community Hero AI{% endblock %}

{% block content %}
<section class="hero-section position-relative text-white">
    <div class="hero-overlay"></div>
    <div class="hero-background"></div>

    <div class="container position-relative hero-content text-center">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <h1 class="hero-title text-uppercase fw-black mb-3">AI-Powered Community Problem Solver</h1>
                <p class="hero-subtitle mb-4">Report, Track and Resolve Local Issues Faster</p>
                <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                    <a href="{{ url_for('web.report_issue_page') }}" class="btn btn-success btn-lg civic-btn">Report Issue</a>
                    <a href="{{ url_for('web.track_issues_page') }}" class="btn btn-light btn-lg civic-btn">View Issues</a>
                </div>
            </div>
        </div>

        <div class="hero-dots" aria-hidden="true">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>
</section>

<section class="feature-section pb-5">
    <div class="container">
        <div class="row g-4">
            <div class="col-md-6 col-lg-3">
                <div class="card civic-card h-100 border-0 rounded-0 shadow-lg text-center feature-card">
                    <div class="card-body p-4 p-xl-5 d-flex flex-column align-items-center justify-content-center">
                        <div class="icon-badge mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h2l1.2-1.8A2 2 0 0 1 11.4 2h1.2a2 2 0 0 1 1.7 1.2L15.5 5h2A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/>
                                <circle cx="12" cy="12" r="3.6"/>
                            </svg>
                        </div>
                        <h3 class="feature-title text-uppercase fw-bold mb-0">Report Issue</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card civic-card h-100 border-0 rounded-0 shadow-lg text-center feature-card">
                    <div class="card-body p-4 p-xl-5 d-flex flex-column align-items-center justify-content-center">
                        <div class="icon-badge mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#212529" class="w-10 h-10">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.75a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM18 5.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM6 18.75a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM6 5.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM12 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 6.75h12M6 17.25h12M6 6l5.25 5.25M18 6l-5.25 5.25M6 18l5.25-5.25M18 18l-5.25-5.25" />
                            </svg>
                        </div>
                        <h3 class="feature-title text-uppercase fw-bold mb-0">AI Analysis</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card civic-card h-100 border-0 rounded-0 shadow-lg text-center feature-card feature-card-active">
                    <div class="card-body p-4 p-xl-5 d-flex flex-column align-items-center justify-content-center">
                        <div class="icon-badge mb-4 icon-badge-active">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M12 21s6-4.6 6-10a6 6 0 1 0-12 0c0 5.4 6 10 6 10z"/>
                                <circle cx="12" cy="11" r="2.3"/>
                            </svg>
                        </div>
                        <h3 class="feature-title text-uppercase fw-bold mb-0 text-white">Track Status</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card civic-card h-100 border-0 rounded-0 shadow-lg text-center feature-card">
                    <div class="card-body p-4 p-xl-5 d-flex flex-column align-items-center justify-content-center">
                        <div class="icon-badge mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#212529" class="w-10 h-10">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
                            </svg>
                        </div>
                        <h3 class="feature-title text-uppercase fw-bold mb-0">Impact Map</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
